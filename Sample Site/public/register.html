<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="/" class="auth-logo">ShopSecure</a>
    <h1 class="auth-title">Create Account</h1>
    <p id="formError" class="form-error"></p>
    <form id="registerForm" class="auth-form">
      <div class="form-group"><label for="username">Username</label><input id="username" type="text" required></div>
      <div class="form-group"><label for="email">Email</label><input id="email" type="email" required></div>
      <div class="form-group"><label for="password">Password</label><input id="password" type="password" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}" title="Must contain at least 1 uppercase, 1 lowercase, 1 digit, with lenght>=8" required></div>
      <div class="form-group"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" required></div>
      <button id="submitBtn" class="btn-primary btn-block" type="submit">Create Account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="/login.html">Login</a></p>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
