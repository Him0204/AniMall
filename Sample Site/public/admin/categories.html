<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Categories</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="/admin/" class="admin-nav-logo">ShopSecure Admin</a>
    <div class="admin-nav-links">
      <a href="/admin/products.html">Products</a>
      <a class="active" href="/admin/categories.html">Categories</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="/">Store</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>
  <main class="admin-main">
    <h1 class="admin-page-title">Categories</h1>
    <section class="admin-card">
      <h2 id="formTitle">Add Category</h2>
      <p id="formError" class="form-error"></p>
      <form id="categoryForm" class="admin-form" enctype="multipart/form-data">
        <div class="form-row">
          <div class="form-group"><label for="name">Name</label><input id="name" name="name" type="text" required></div>
          <div class="form-group"><label for="image">Image</label><input id="image" name="image" type="file" accept=".jpg,.jpeg,.png,.webp"></div>
        </div>
        <div class="form-group"><label for="description">Description</label><textarea id="description" name="description" rows="3"></textarea></div>
        <div class="form-actions">
          <button class="btn-primary" type="submit">Save Category</button>
          <button class="btn-secondary hidden" id="cancelEditBtn" type="button">Cancel Edit</button>
        </div>
      </form>
    </section>
    <section class="admin-card">
      <div class="table-responsive">
        <table class="admin-table">
          <thead><tr><th>Image</th><th>Name</th><th>Slug</th><th>Description</th><th>Actions</th></tr></thead>
          <tbody id="categoriesTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin/admin.js"></script>
  <script src="/js/admin/categories.js"></script>
</body>
</html>
