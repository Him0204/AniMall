<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="/admin/" class="admin-nav-logo">ShopSecure Admin</a>
    <div class="admin-nav-links">
      <a class="active" href="/admin/products.html">Products</a>
      <a href="/admin/categories.html">Categories</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="/">Store</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>
  <main class="admin-main">
    <h1 class="admin-page-title">Products</h1>
    <section class="admin-card">
      <h2 id="formTitle">Add New Product</h2>
      <p id="formError" class="form-error"></p>
      <form id="productForm" class="admin-form" enctype="multipart/form-data">
        <div class="form-row">
          <div class="form-group"><label for="name">Name</label><input id="name" name="name" type="text" required></div>
          <div class="form-group"><label for="categorySelect">Category</label><select id="categorySelect" name="category_id"><option value="">— None —</option></select></div>
        </div>
        <div class="form-group"><label for="description">Description</label><textarea id="description" name="description" rows="3"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label for="price">Price</label><input id="price" name="price" type="number" min="0" step="0.01" required></div>
          <div class="form-group"><label for="stock">Stock</label><input id="stock" name="stock" type="number" min="0" required></div>
          <div class="form-group"><label for="is_active">Status</label><select id="is_active" name="is_active"><option value="1">Active</option><option value="0">Hidden</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="image">Image</label><input id="image" name="image" type="file" accept=".jpg,.jpeg,.png,.webp"></div>
          <div class="form-group"><label for="stripe_price_id">Stripe Price ID</label><input id="stripe_price_id" name="stripe_price_id" type="text"></div>
        </div>
        <div class="form-actions">
          <button class="btn-primary" type="submit">Save Product</button>
          <button class="btn-secondary hidden" id="cancelEditBtn" type="button">Cancel Edit</button>
        </div>
      </form>
    </section>
    <section class="admin-card">
      <div class="table-responsive">
        <table class="admin-table">
          <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="productsTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin/admin.js"></script>
  <script src="/js/admin/products.js"></script>
</body>
</html>
