<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="/" class="auth-logo">ShopSecure</a>
    <h1 class="auth-title">Sign In</h1>
    <p id="formError" class="form-error"></p>
    <form id="loginForm" class="auth-form" novalidate>
      <div class="form-group"><label for="email">Email</label><input id="email" type="email" required></div>
      <div class="form-group"><label for="password">Password</label><input id="password" type="password" required></div>
      <button id="submitBtn" class="btn-primary btn-block" type="submit">Sign In</button>
    </form>
    <p class="auth-footer">No account? <a href="/register.html">Register</a></p>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
