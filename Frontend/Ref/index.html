<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>AniMall - Home</title>
</head>
<body>
  <div class="site-wrapper">
    <input type="checkbox" id="cart-toggle" class="cart-toggle-input" aria-label="Toggle shopping cart">
    <label for="cart-toggle" class="cart-fab" aria-label="Open shopping cart">
      <img src="assets/img/icon-cart.png" alt="" class="cart-icon-img" aria-hidden="true">
      <span class="cart-count" aria-label="2 items in cart">2</span>
    </label>
    <label for="cart-toggle" class="cart-overlay" aria-label="Close shopping cart overlay"></label>

    <aside class="cart-drawer floating-cart" role="region" aria-label="Shopping cart">
      <div class="cart-header"><h2>Shopping Cart</h2></div>
      <div class="cart-content"><p class="admin-hint">Cart UI is visual-only for Phase 2B.</p></div>
      <div class="cart-footer"><button class="cart-checkout-btn" type="button">Proceed to Checkout</button></div>
    </aside>

    <header class="site-header" role="banner">
      <div class="container">
        <div class="header-main">
          <div class="header-brand">
            <a class="logo" href="index.html" aria-label="AniMall home">
              <img class="logo-icon" src="assets/img/icon-paw.png" alt="" aria-hidden="true">
              <span class="logo-text">AniMall</span>
            </a>
          </div>
          <nav class="header-nav desktop-nav" aria-label="Main navigation">
            <ul class="primary-nav">
              <li><a href="index.html">Home</a></li>
              <li><a href="category.html">Category</a></li>
              <li><a href="/admin">Admin</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <main id="home-page" class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <span aria-current="page">Home</span>
      </nav>

      <section class="product-section" aria-label="Products by category">
        <h1 class="section-title">Products</h1>
        <nav class="category-pills" id="category-list" aria-label="Product categories"></nav>
        <p id="load-error" class="error-text" hidden>Unable to load products right now.</p>
        <div class="product-grid" id="product-grid"></div>
      </section>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container"><div class="footer-bottom"><p>&copy; 2026 AniMall (IERG4210 Assignment).</p></div></div>
    </footer>
  </div>
  <script src="assets/js/index.js" defer></script>
</body>
</html>
