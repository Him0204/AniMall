<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>AniMall - Product</title>
</head>
<body>
  <div class="site-wrapper">
    <input type="checkbox" id="cart-toggle" class="cart-toggle-input" aria-label="Toggle shopping cart">
    <label for="cart-toggle" class="cart-fab" aria-label="Open shopping cart">
      <img src="assets/img/icon-cart.png" alt="" class="cart-icon-img" aria-hidden="true">
      <span class="cart-count" aria-label="2 items in cart">2</span>
    </label>
    <label for="cart-toggle" class="cart-overlay" aria-label="Close shopping cart overlay"></label>

    <aside class="cart-drawer floating-cart" role="region" aria-label="Shopping cart">
      <div class="cart-header"><h2>Shopping Cart</h2></div>
      <div class="cart-content"><p class="admin-hint">Cart UI is visual-only for Phase 2B.</p></div>
      <div class="cart-footer"><button class="cart-checkout-btn" type="button">Proceed to Checkout</button></div>
    </aside>

    <header class="site-header" role="banner">
      <div class="container">
        <div class="header-main">
          <div class="header-brand"><a class="logo" href="index.html"><img class="logo-icon" src="assets/img/icon-paw.png" alt="" aria-hidden="true"><span class="logo-text">AniMall</span></a></div>
          <nav class="header-nav desktop-nav" aria-label="Main navigation"><ul class="primary-nav"><li><a href="index.html">Home</a></li><li><a href="category.html">Category</a></li>
              <li><a href="/admin">Admin</a></li></ul></nav>
        </div>
      </div>
    </header>

    <main id="product-page" class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb" id="product-breadcrumbs">
        <a href="index.html">Home</a> <span class="sep">›</span> <span aria-current="page">Product</span>
      </nav>
      <p id="load-error" class="error-text" hidden>Unable to load product details.</p>
      <section class="product-detail-section" aria-label="Product details" id="product-detail" hidden>
        <div class="product-detail-layout">
          <div class="product-gallery">
            <div class="product-main-media"><div class="media-panel m1"><img id="product-image" src="assets/img/img001.webp" alt="Product image"></div></div>
          </div>
          <div class="product-details">
            <h1 id="product-name">Product name</h1>
            <div class="product-price" id="product-price">HK$0</div>
            <p class="product-desc" id="product-description"></p>
            <button class="product-add-btn" type="button">Add to Cart</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" role="contentinfo"><div class="container"><div class="footer-bottom"><p>&copy; 2026 AniMall.</p></div></div></footer>
  </div>
  <script src="assets/js/product.js" defer></script>
</body>
</html>
