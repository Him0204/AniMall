<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>AniMall - Member Portal</title>
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header" role="banner">
      <div class="container">
        <input type="checkbox" id="menu-toggle" class="menu-toggle-input" aria-label="Toggle menu">
        <div class="header-main">
          <div class="header-brand">
            <a class="logo" href="index.html" aria-label="AniMall home">
              <img class="logo-icon" src="assets/img/icon-paw.png" alt="" aria-hidden="true">
              <span class="logo-text">AniMall</span>
            </a>
          </div>

          <nav class="header-nav desktop-nav" aria-label="Main navigation">
            <ul class="primary-nav">
              <li><a href="index.html">Home</a></li>
              <li><a href="member.html" aria-current="page">Member Portal</a></li>
              <li><a class="admin-link" href="admin.html">Admin</a></li>
            </ul>
          </nav>

          <div class="header-actions">
            <button class="lang-btn" type="button" aria-label="Switch language">EN</button>
            <span class="user-label" aria-live="polite">Guest</span>
            <a class="login-btn" href="login.html" aria-label="Login">Login</a>

            <label for="menu-toggle" class="menu-toggle-btn" aria-label="Open menu">
              <svg class="icon menu-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
              </svg>
              <svg class="icon close-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3 1.4 1.4z"/>
              </svg>
            </label>
          </div>
        </div>

        <nav class="mobile-nav" aria-label="Mobile navigation">
          <ul class="mobile-nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="member.html" aria-current="page">Member Portal</a></li>
            <li><a class="admin-link" href="admin.html">Admin</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="admin-page member-page">
      <h1>Member Portal</h1>
      <p id="member-message" class="admin-message" hidden></p>
      <p id="member-error" class="error-text" hidden></p>

      <div class="admin-grid">
        <section class="admin-card">
          <div class="admin-section">
            <h2>Recent Orders</h2>
            <p class="admin-orders-note">Your latest 5 purchases are listed below.</p>
            <div class="admin-orders-table-wrap">
              <table class="orders-table" aria-label="Recent orders">
                <thead>
                  <tr>
                    <th scope="col">Order</th>
                    <th scope="col">Status</th>
                    <th scope="col">Amount</th>
                    <th scope="col">Items</th>
                    <th scope="col">Created</th>
                    <th scope="col">Paid</th>
                  </tr>
                </thead>
                <tbody id="member-orders-body"></tbody>
              </table>
            </div>
            <p id="member-orders-empty" class="admin-orders-empty" hidden>You have no orders yet.</p>
          </div>
        </section>
      </div>

      <a class="admin-back-link" href="index.html">&#8592; Back to Store</a>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <div class="footer-bottom">
          <p>&copy; 2026 AniMall (IERG4210 Assignment).</p>
        </div>
      </div>
    </footer>
  </div>

  <script src="assets/js/user.js" defer></script>
  <script src="assets/js/member.js" defer></script>
</body>
</html>
