<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>AniMall - Admin Categories</title>
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header" role="banner">
      <div class="container">
        <div class="header-main admin-header-main">
          <div class="header-brand">
            <a class="logo" href="index.html" aria-label="AniMall home">
              <img class="logo-icon" src="assets/img/icon-paw.png" alt="" aria-hidden="true">
              <span class="logo-text">AniMall</span>
            </a>
          </div>

          <nav class="header-nav desktop-nav" aria-label="Admin navigation">
            <ul class="primary-nav admin-primary-nav">
              <li><a href="admin.html" aria-current="page">Categories</a></li>
              <li><a href="admin-products.html">Products</a></li>
              <li><a href="admin-orders.html">Orders</a></li>
            </ul>
          </nav>

          <div class="header-actions">
            <span class="user-label" aria-live="polite">Guest</span>
            <a class="login-btn" href="login.html" aria-label="Login">Login</a>
          </div>
        </div>

        <nav class="mobile-nav admin-mobile-nav" aria-label="Admin mobile navigation">
          <ul class="mobile-nav-list">
            <li><a href="admin.html" aria-current="page">Categories</a></li>
            <li><a href="admin-products.html">Products</a></li>
            <li><a href="admin-orders.html">Orders</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="admin-page">
      <h1 hidden aria-hidden="true">Admin Panel - Categories</h1>
      <p id="admin-message" class="admin-message" hidden></p>
      <p id="admin-error" class="error-text" hidden>Unable to load admin data right now.</p>

      <div class="admin-grid admin-grid--category" hidden aria-hidden="true">
        <section class="admin-card">
          <div class="admin-section">
            <h2>Create Category</h2>
            <form id="form-create-category">
              <input type="hidden" name="csrfToken" class="csrf-token-input">
              <label>Name
                <input name="name" maxlength="120" required placeholder="Category name" pattern=".*\S.*">
              </label>
              <button type="submit" class="btn-primary">Create</button>
            </form>
          </div>
        </section>

        <section class="admin-card">
          <div class="admin-section">
            <h2>Update Category</h2>
            <form id="form-update-category">
              <input type="hidden" name="csrfToken" class="csrf-token-input">
              <label>Category
                <select name="catid" id="update-category-catid" required></select>
              </label>
              <label>New Name
                <input name="name" maxlength="120" required placeholder="New category name" pattern=".*\S.*">
              </label>
              <button type="submit" class="btn-primary">Update</button>
            </form>
          </div>
        </section>

        <section class="admin-card admin-card--full">
          <div class="admin-section">
            <h2>Delete Category</h2>
            <form id="form-delete-category">
              <input type="hidden" name="csrfToken" class="csrf-token-input">
              <label>Category
                <select name="catid" id="delete-category-catid" required></select>
              </label>
              <button type="submit" class="btn-danger">Delete</button>
            </form>
          </div>
        </section>
      </div>

    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <div class="footer-bottom">
          <p>&copy; 2026 AniMall (IERG4210 Assignment).</p>
        </div>
      </div>
    </footer>
  </div>

  <script src="assets/js/user.js" defer></script>
  <script src="assets/js/admin.js" defer></script>
</body>
</html>
