<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>AniMall - Login</title>
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header" role="banner">
      <div class="container">
        <div class="header-main">
          <div class="header-brand">
            <a class="logo" href="index.html" aria-label="AniMall home">
              <img class="logo-icon" src="assets/img/icon-paw.png" alt="" aria-hidden="true">
              <span class="logo-text">AniMall</span>
            </a>
          </div>
          <nav class="header-nav desktop-nav" aria-label="Main navigation">
            <ul class="primary-nav">
              <li><a href="index.html">Home</a></li>
              <li><a href="admin.html">Admin</a></li>
              <li><a href="index.html#about">About Us</a></li>
              <li><a href="index.html#contact">Contact Us</a></li>
            </ul>
          </nav>
          <div class="header-actions">
            <span class="user-label" aria-live="polite">Guest</span>
            <a class="login-btn" href="login.html" aria-current="page">Login</a>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-page">
      <h1>Account Access</h1>
      <p id="auth-message" class="admin-message" hidden></p>
      <p id="auth-error" class="error-text" hidden></p>

      <div class="admin-grid">
        <section class="admin-card">
          <div class="admin-section">
            <h2>Login</h2>
            <form id="login-form">
              <input type="hidden" name="csrfToken" class="csrf-token-input">
              <label>Email
                <input type="email" name="email" autocomplete="email" required placeholder="you@example.com">
              </label>
              <label>Password
                <input type="password" name="password" autocomplete="current-password" required minlength="10" placeholder="Enter your password">
              </label>
              <button type="submit" class="btn-primary">Login</button>
            </form>
          </div>
        </section>

        <section class="admin-card">
          <div class="admin-section">
            <h2>Create Account</h2>
            <form id="register-form">
              <input type="hidden" name="csrfToken" class="csrf-token-input">
              <label>Name (optional)
                <input type="text" name="name" maxlength="120" placeholder="Your name">
              </label>
              <label>Email
                <input type="email" name="email" autocomplete="email" required placeholder="you@example.com">
              </label>
              <label>Password (min 10 chars)
                <input type="password" name="password" autocomplete="new-password" required minlength="10" placeholder="Create a strong password">
              </label>
              <label>Confirm Password
                <input type="password" name="confirmPassword" autocomplete="new-password" required minlength="10" placeholder="Re-enter your password">
              </label>
              <button type="submit" class="btn-primary">Register</button>
            </form>
          </div>
        </section>

        <section class="admin-card">
          <div class="admin-section">
            <h2>Change Password</h2>
            <form id="password-form">
              <input type="hidden" name="csrfToken" class="csrf-token-input">
              <label>Current Password
                <input type="password" name="currentPassword" autocomplete="current-password" required minlength="10" placeholder="Current password">
              </label>
              <label>New Password (min 10 chars)
                <input type="password" name="newPassword" autocomplete="new-password" required minlength="10" placeholder="New strong password">
              </label>
              <label>Confirm New Password
                <input type="password" name="confirmPassword" autocomplete="new-password" required minlength="10" placeholder="Re-enter new password">
              </label>
              <button type="submit" class="btn-primary">Update Password</button>
            </form>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <div class="footer-bottom">
          <p>&copy; 2026 AniMall (IERG4210 Assignment).</p>
        </div>
      </div>
    </footer>
  </div>
  <script src="assets/js/user.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
</body>
</html>
